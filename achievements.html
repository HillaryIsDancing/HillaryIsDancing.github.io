<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ffeef6">
<title>Hindex · Achievements</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #5b4350;
  background:
    radial-gradient(circle at top left, rgba(255,215,235,.95), transparent 28%),
    radial-gradient(circle at top right, rgba(255,230,240,.9), transparent 24%),
    linear-gradient(180deg, #fff8fc 0%, #ffeef6 45%, #fff6fb 100%);
}
main { width: min(1120px, 92%); margin: auto; padding: 48px 0 64px; }
.hero { text-align: center; margin-bottom: 32px; }
.wordmark {
  display: inline-flex; align-items: baseline; justify-content: center; gap: .26em;
  position: relative; margin: 0; color: #6b3f53; font-size: clamp(38px, 7vw, 56px); line-height: 1.1;
}
.wordmark::before, .wordmark::after { position: absolute; opacity: .9; }
.wordmark::before { content: "🧸"; right: calc(100% + .95em); top: -.15em; font-size: .5em; }
.wordmark::after { content: "🐈"; left: calc(100% + 1.4em); top: 0; font-size: .4em; }
.bear { font-size: .7em; color: #cc7aa2; }
.subtitle { color: #8d6b7d; font-size: 17px; margin: 14px 0 0; }
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
button { cursor: pointer; font: inherit; }
.filters button, .retry {
  border: 2px solid #f2c6da; border-radius: 999px; padding: 10px 20px;
  font-size: 14px; font-weight: bold; color: #79435d; background: rgba(255,255,255,.95);
}
.filters button[aria-pressed=true], .retry {
  color: #562b43; background: linear-gradient(135deg,#ff8fc2,#f7a6cf);
  border-color: transparent; box-shadow: 0 10px 22px rgba(233,141,186,.28);
}
.filters button:hover, .retry:hover { border-color: #e68ab2; }
button:focus-visible, summary:focus-visible { outline: 3px solid #ae3672; outline-offset: 3px; }
#status { text-align: center; margin: 18px 0 22px; font-weight: 600; color: #8a677a; }
.retry:not([hidden]) { display: block; margin: 0 auto; }
#cards { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,310px),1fr)); gap: 22px; }
article {
  min-width: 0; display: flex; flex-direction: column; padding: 20px; overflow-wrap: anywhere;
  border: 2px solid #f7d7e5; border-radius: 24px; background: rgba(255,255,255,.95);
  box-shadow: 0 10px 24px rgba(221,181,199,.18);
}
article header { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
h2 { margin: 0; font-size: 1.55rem; line-height: 1.14; color: #5b4350; }
.badge {
  font-size: .78rem; line-height: 1.25; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 750; color: #82687b; background: #f6eff4; border-radius: 999px; padding: 5px 10px;
}
.earned { background: #fff0f7; color: #a7346a; }
article p { margin: 12px 0 18px; color: #806375; line-height: 1.5; }
.meter { margin-top: auto; display: flex; align-items: center; gap: 12px; color: #815468; font-weight: 600; font-size: .875rem; }
progress { width: 100%; min-width: 0; height: 8px; flex: 1; appearance: none; border: none; border-radius: 999px; background: #f9e3ee; }
progress::-webkit-progress-bar { background: #f9e3ee; border-radius: 999px; }
progress::-webkit-progress-value { background: linear-gradient(90deg,#e377aa,#ff9cc8); border-radius: 999px; }
progress::-moz-progress-bar { background: #e377aa; border-radius: 999px; }
details { margin-top: 14px; border-top: 1px solid #f7d7e5; padding-top: 10px; font-size: .9rem; }
summary { cursor: pointer; color: #935370; } ol { padding-left: 1.35rem; } li { margin: 5px 0; }
@media (max-width: 520px) {
  main { padding-top: 34px; } .filters { gap: 6px; } .filters button { padding: 9px 13px; }
}
</style>
</head>
<body>
<main>
<header class="hero">
<h1 class="wordmark" aria-label="Hindex Achievements">Hindex <span class="bear" aria-hidden="true">ʕ•ᴥ•ʔ</span></h1>
<p class="subtitle">Achievements in Hillary’s K-pop dance archive.</p>
</header>
<div class="filters" role="group" aria-label="Filter achievements">
<button data-filter="all" aria-pressed="true">ALL</button>
<button data-filter="unlocked" aria-pressed="false">UNLOCKED</button>
<button data-filter="locked" aria-pressed="false">LOCKED</button>
</div>
<p id="status" role="status">Loading achievements…</p>
<button class="retry" hidden onclick="location.reload()">Try again</button>
<section id="cards" aria-label="Achievements"></section>
</main>
<script>
'use strict';
const cards=document.querySelector('#cards');
const statusLine=document.querySelector('#status');
const filters=[...document.querySelectorAll('[data-filter]')];
let selected='all', records=null;
function node(tag,text,css){
 const element=document.createElement(tag);
 if(text!==undefined)element.textContent=text;
 if(css)element.className=css;
 return element;
}
function summarize(record,data){
 const rules=record.conditions||[];
 if(rules.length<2)return record.description||'';
 const first=rules[0],group=data.groups?.[first.scopeGroup];
 if(record.match==='all'&&first.type==='artist_times'&&group?.membershipComplete&&rules.every(r=>
  r.type==='artist_times'&&r.scopeGroup===group.id&&r.target===1&&group.memberIds.includes(r.personId))){
  const members=new Set(rules.map(r=>r.personId));
  if(group.memberIds.every(id=>members.has(id)))return 'Cover all '+members.size+' members of '+group.name+' at least once.';
 }
 return (record.match==='any'?'Complete any one of ':'Complete all ')+rules.length+' conditions.';
}
function card(record){
 const box=node('article'),head=node('header'),earned=record.unlocked;
 head.append(node('h2',record.title),node('span',earned?'Unlocked':'Locked','badge'+(earned?' earned':'')));box.append(head);
 const description=summarize(record,window.HID_DATA);
 if(description)box.append(node('p',description));
 if(record.total>0){
  const line=node('div',undefined,'meter'),bar=node('progress');
  bar.max=record.total;bar.value=record.current;bar.setAttribute('aria-label','Achievement progress');
  line.append(bar,node('span',record.current+' / '+record.total));box.append(line);
 }
 if(record.conditions?.length>1){
  const details=node('details'),list=node('ol');
  const parts=(record.description||'').split(record.match==='any'?' OR ':' AND ');
  for(const item of parts)if(item)list.append(node('li',item));
  if(list.childElementCount){details.append(node('summary','View conditions'),list);box.append(details)}
 }
 return box;
}
function render(){
 filters.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===selected)));
 if(records===null)return;
 const visible=records.filter(r=>selected==='all'||(selected==='unlocked')===r.unlocked);
 cards.replaceChildren(...visible.map(card));
 statusLine.textContent=visible.length?'Showing '+visible.length+' of '+records.length+' achievement'+(records.length===1?'':'s'):({all:'No achievements yet.',unlocked:'No achievements unlocked yet.',locked:'No locked achievements.'})[selected];
}
filters.forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.filter;render()}));
async function start(){
 const base=location.protocol==='file:'?'https://hillaryisdancing.github.io/data/':'./data/';
 try{
  for(const name of ['groups','artists','dances','achievements']){
   await new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.onload=resolve;script.onerror=reject;
    script.src=base+name+'.js';document.head.append(script);
   });
  }
  const data=window.HID_DATA;
  const dances=await data.loadDanceData();
  records=data.evaluateAllAchievements(dances).sort((a,b)=>Number(b.unlocked)-Number(a.unlocked));
  render();
 }catch{
  statusLine.textContent='Could not load achievement progress. Please try again.';
  document.querySelector('.retry').hidden=false;
 }
}
start();
</script>
</body>
</html>
